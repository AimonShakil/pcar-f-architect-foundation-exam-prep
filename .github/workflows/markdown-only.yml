name: Markdown-only check

# Run on every pull request, and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-file-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fail if any non-Markdown file is tracked
        run: |
          # Allowed exceptions: .gitignore and the .github configuration folder
          ALLOW='^(\.gitignore|\.github/.*)$'

          bad=$(git ls-files | grep -viE '\.md$' | grep -vE "$ALLOW" || true)

          if [ -n "$bad" ]; then
            echo "Only Markdown files are allowed. Offending files:"
            while read -r f; do
              echo "::error file=$f::Not a Markdown file: $f"
            done <<< "$bad"
            exit 1
          fi
          echo "All tracked files are Markdown."
